name: CI

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'schemas/**'
      - 'examples/**'
      - 'checklists/**'
      - 'references/**'
      - 'evals/**'
      - 'docs/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CHANGELOG.md'
      - 'SYSTEM-MAP.md'
      - 'ROADMAP.md'
      - 'ROUTING-MATRIX.md'
      - 'SKILL.md'
      - 'requirements.txt'
      - 'requirements.lock'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  push:
    # `[$default-branch]` was a literal YAML string, never a GitHub expression —
    # pushes to the default branch never triggered CI. Use the explicit branch
    # name (verified: default branch is `main`). See issue #375.
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'schemas/**'
      - 'examples/**'
      - 'checklists/**'
      - 'references/**'
      - 'evals/**'
      - 'docs/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CHANGELOG.md'
      - 'SYSTEM-MAP.md'
      - 'ROADMAP.md'
      - 'ROUTING-MATRIX.md'
      - 'SKILL.md'
      - 'requirements.txt'
      - 'requirements.lock'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  # ── Primary gate (issue #375): the full pytest suite. ──────────────────────
  # Local `python3 -m pytest -q` and this job must be equivalent, so a green CI
  # implies a green local run. CLI checks run separately below as supplements.
  pytest:
    name: pytest (full gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - name: Full pytest suite
        run: python3 -m pytest -q
      - name: Collection scope sanity
        run: python3 -m pytest --collect-only -q | tail -1

  # ── CLI checks: explicit per-script runs that supplement (not replace) the
  #    pytest gate. Kept as individual steps so failures are visible per check.
  cli-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: python3 -m py_compile scripts/*.py
      - run: python3 scripts/validate_research_pack.py examples/research-pack-example.md
      - run: python3 scripts/validate_research_pack.py examples/research-pack-example.md --strict
      - run: python3 scripts/test_validator_regression.py
      - run: python3 scripts/test_forward_looking_label_lint.py
      - run: python3 scripts/test_market_outlook_monitoring_contract.py
      - run: python3 scripts/test_benchmark_comparability_contract.py
      - run: python3 scripts/test_equipment_selection_contract.py
      - run: python3 scripts/test_declared_execution.py
      - run: python3 scripts/test_listed_company_delivery.py
      - run: python3 scripts/test_report_quality_validator.py
      - run: python3 scripts/test_doc_eval_sync.py
      - run: python3 scripts/test_eval_index.py
      - run: python3 scripts/validate_eval_registry.py
      - run: python3 scripts/run_forward_evals.py --offline --check-baseline --json
      - run: python3 scripts/test_rule_trigger_rate_audit.py
      - run: python3 scripts/test_md_to_pdf_preflight.py
      - run: python3 scripts/test_control_plane_architecture_discipline.py
      - run: python3 scripts/test_quantitative_role_audit.py
      - run: python3 scripts/test_source_label_consistency.py
      - run: python3 tests/test_issue_350_contracts.py
      # test_issue_361/validate_contract/discipline_registry/route_activation
      # are covered by the full pytest gate above; running them again here
      # would be redundant.
      - run: bash scripts/validate-docs-structure.sh
      - run: python3 scripts/validate_route_manifest.py
      - run: python3 tests/test_route_manifest.py
      # ── Issue #380: route cards must stay in sync with the manifest ────────
      - run: python3 scripts/generate_route_cards.py --check
      - run: python3 -m pytest -q tests/test_route_cards.py
      - run: python3 scripts/test_audit_report.py
      - run: python3 scripts/test_route_decision_tree.py
      - run: python3 scripts/validate_contract.py references/report-template.md --require-contract
      - run: python3 scripts/test_issue_pr_acceptance.py
      # ── Issue #378: required-audit execution end-to-end fixtures ──────────
      # Positive fixtures must pass under fail-closed flags.  Strict mode
      # requires a research pack, so each positive fixture pairs with the
      # pack whose artifact id matches its contract.
      - run: python3 scripts/audit_report.py tests/fixtures/audit/market-outlook-pos.md --research-pack tests/fixtures/audit/research-pack-pos.md --strict --require-contract
      - run: python3 scripts/audit_report.py tests/fixtures/audit/shared-workflow-pos.md --research-pack tests/fixtures/audit/research-pack-shared-workflow-pos.md --strict --require-contract
      - run: python3 scripts/audit_report.py tests/fixtures/audit/market-outlook-mixed-pos.md --research-pack tests/fixtures/audit/research-pack-mixed-pos.md --strict --require-contract
      # Negative fixtures must fail with exit 2 (fail closed), not exit 0.
      # (Plain `A && exit 1 || test $? -eq 2` trips ShellCheck SC2015.)
      - run: |
          set +e
          python3 scripts/audit_report.py tests/fixtures/audit/market-outlook-neg.md --strict --require-contract
          rc=$?
          set -e
          test $rc -eq 2
      - run: |
          set +e
          python3 scripts/audit_report.py tests/fixtures/audit/shared-workflow-neg.md --strict --require-contract
          rc=$?
          set -e
          test $rc -eq 2
      - run: |
          set +e
          python3 scripts/audit_report.py tests/fixtures/audit/market-outlook-mixed-neg.md --strict --require-contract
          rc=$?
          set -e
          test $rc -eq 2
      # JSON verdict must be machine-consumable.
      - run: python3 scripts/audit_report.py tests/fixtures/audit/market-outlook-pos.md --research-pack tests/fixtures/audit/research-pack-pos.md --strict --require-contract --json | python3 -c "import json,sys; json.load(sys.stdin)"

  # ── Workflow config lint (issue #375): validates branch/path filter
  #    semantics so a broken trigger cannot silently disable CI.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        shell: bash
        run: |
          bash <(curl -sL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: python -m playwright install chromium --with-deps
      - run: |
          temp=$(mktemp -d)
          cat > "$temp/in.md" << 'INEOF'
          ---
          title: <script>x</script>
          date: 2024-01-01
          type: test
          ---

          # Body
          INEOF
          python3 scripts/markdown_to_html.py "$temp/in.md" "$temp/out.html"
          grep -q '&lt;script&gt;' "$temp/out.html" || { echo 'FAIL: metadata not escaped'; exit 1; }
          grep -q '<br>' "$temp/out.html" || { echo 'FAIL: <br> missing from multiline meta'; exit 1; }
          ! grep -q '&lt;br&gt;' "$temp/out.html" || { echo 'FAIL: <br> was escaped instead of literal'; exit 1; }
          echo 'HTML escaping regression check OK'
          rm -rf "$temp"
      - run: |
          temp=$(mktemp -d)
          cat > "$temp/in.md" << 'INEOF'
          # Test

          Safe text.

          <script>alert(1)</script>
          <iframe src="https://evil.com"></iframe>
          <img src="x" onerror="alert(1)">
          <a href="javascript:alert(1)">bad</a>
          INEOF
          python3 scripts/markdown_to_html.py "$temp/in.md" "$temp/out.html"
          ! grep -qi '<script\|<iframe\|onerror=' "$temp/out.html" || { echo 'FAIL: body HTML not sanitized (script/iframe/onerror)'; exit 1; }
          ! grep -qi 'javascript:' "$temp/out.html" || { echo 'FAIL: javascript: URL not sanitized'; exit 1; }
          ! grep -qi 'style=' "$temp/out.html" || { echo 'FAIL: inline style not removed'; exit 1; }
          ! grep -qi '<img' "$temp/out.html" || { echo 'FAIL: img tag not stripped'; exit 1; }
          grep -q 'Safe text' "$temp/out.html" || { echo 'FAIL: safe content lost'; exit 1; }
          echo 'HTML sanitization check OK'
          rm -rf "$temp"
      - run: |
          temp=$(mktemp -d)
          cat > "$temp/in.md" << 'INEOF'
          # CSS/Style

          <span style="background:url(javascript:alert(1))">css-url</span>
          <div style="position:fixed;top:0">fixed</div>
          <span style="color:red">safe style</span>
          INEOF
          python3 scripts/markdown_to_html.py "$temp/in.md" "$temp/out.html"
          ! grep -q 'style=' "$temp/out.html" || { echo 'FAIL: style attr not stripped'; exit 1; }
          grep -q 'css-url' "$temp/out.html" || { echo 'FAIL: text content lost when style stripped'; exit 1; }
          grep -q 'fixed' "$temp/out.html" || { echo 'FAIL: text content lost when style stripped'; exit 1; }
          grep -q 'safe style' "$temp/out.html" || { echo 'FAIL: text content lost when style stripped'; exit 1; }
          echo 'CSS style stripping check OK'
          rm -rf "$temp"
      - run: |
          temp=$(mktemp -d)
          cat > "$temp/in.md" << 'INEOF'
          # Img src

          <img src="https://evil.com/track.png" alt="tracker">
          <img src="local.png" alt="local">
          INEOF
          python3 scripts/markdown_to_html.py "$temp/in.md" "$temp/out.html"
          ! grep -qi '<img' "$temp/out.html" || { echo 'FAIL: img tag not stripped'; exit 1; }
          echo 'Img stripping check OK'
          rm -rf "$temp"
      - run: python3 scripts/test_remote_block.py
      - run: python3 scripts/test_cjk_pdf_pipeline.py
      - name: PDF structure and visual smoke regression
        run: |
          artifact_dir="$RUNNER_TEMP/deep-research-pdf-regression"
          python3 scripts/check_pdf_regression.py --artifact-dir "$artifact_dir"
      - name: Upload PDF regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-research-pdf-regression
          path: ${{ runner.temp }}/deep-research-pdf-regression
          if-no-files-found: warn
      - run: |
          temp=$(mktemp -d)
          printf '# Test\n\nHello.\n' > "$temp/in.md"
          printf '# Status target\n' > "$temp/status.md"
          set +e
          PLAYWRIGHT_BROWSERS_PATH="$temp/no-browsers" \
            python3 scripts/md_to_pdf.py "$temp/in.md" "$temp/out.pdf" \
            --title "Preflight" --json --write-status "$temp/status.md" > "$temp/out" 2> "$temp/err"
          rc=$?
          set -e
          cat "$temp/err"
          if [ $rc -ne 1 ]; then echo "FAIL: expected exit 1, got $rc"; exit 1; fi
          python3 -c "import json,pathlib; d=json.loads(pathlib.Path('$temp/out').read_text()); assert d['markdown_status']=='md_ready'; assert d['delivery_status']=='pdf_failed'; assert any('Chromium' in e for e in d['errors'])"
          grep -q '^pdf_failed$' "$temp/status.md" || { echo 'FAIL: status writeback missing pdf_failed'; exit 1; }
          echo 'Chromium failure status check OK'
          rm -rf "$temp"
      - run: |
          input_dir="/tmp/smoke test path"
          mkdir -p "$input_dir"
          printf '# Smoke Test\n\nTest paragraph.\n' > "$input_dir/input.md"
          python3 scripts/md_to_pdf.py "$input_dir/input.md" "$input_dir/output.pdf" \
            --title "CI Smoke Test"
          python3 -c "import sys,pathlib; d=pathlib.Path('/tmp/smoke test path/output.pdf').read_bytes(); assert len(d)>0 and d[:4]==b'%PDF'; print('PDF OK: '+str(len(d))+' bytes')"
          rm -rf "$input_dir"
      - run: |
          temp=$(mktemp -d)
          dir="$temp/hash path #frag/query ?q/中文 路径"
          mkdir -p "$dir"
          md_file="$dir/in#frag?query 中文.md"
          html_file="$dir/in#frag?query 中文.html"
          pdf_file="$dir/out#frag?query 中文.pdf"
          printf '# Special Char Test\n\nTest paragraph.\n' > "$md_file"

          # Full pipeline (md_to_pdf.py)
          python3 scripts/md_to_pdf.py "$md_file" "$pdf_file" --title "Special Char Test"
          python3 -c "import sys,pathlib; d=pathlib.Path('$pdf_file').read_bytes(); assert len(d)>0 and d[:4]==b'%PDF'; print('Pipeline OK: '+str(len(d))+' bytes')"

          # Direct renderer (render_pdf.py) — generate HTML first
          python3 scripts/markdown_to_html.py "$md_file" "$html_file"
          direct_pdf="$dir/renderer_direct.pdf"
          python3 scripts/render_pdf.py "$html_file" "$direct_pdf"
          python3 -c "import sys,pathlib; d=pathlib.Path('$direct_pdf').read_bytes(); assert len(d)>0 and d[:4]==b'%PDF'; print('Renderer direct OK: '+str(len(d))+' bytes')"

          echo 'Special character path smoke OK'
          rm -rf "$temp"
